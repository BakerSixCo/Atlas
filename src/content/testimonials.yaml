    source: "Google review (excerpt)"
    stars: 5
    quote: "As a veteran who just started BJJ last week, I was looking for community, structure, and a strong workout. Atlas has all three. The coaches are professional, the environment is welcoming, and the people make it easy to keep showing up."
  - name: ''
    detail: ''
    source: "Google review"
    stars: 5
    quote: "Great atmosphere and coaching; intense but also safe, no one cranks submissions. It’s all No-Gi, and Chase (the head coach) specializes in helping wrestlers cross over to submission grappling. So if you, like me, don’t have a wrestling background, It’s a great place to develop both wrestling and Jiu-Jitsu skills"
