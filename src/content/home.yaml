heroKicker: Meridian, Idaho · No-Gi Brazilian Jiu-Jitsu
heroTitle: No egos. Just jiu-jitsu.
heroSubtitle: >-
  Train hard, build confidence, and find a place where students of every level
  can grow and belong.
heroImage: /src/assets/images/photos/class-10.jpg
heroImageAlt: Two Atlas students rolling during a no-gi class while teammates train behind them
pillars:
  - title: Black-belt instruction
    body: >-
      Every class is taught by a black belt from the Keith Owen / Pedro Sauer
      lineage — structured, technical, and built to make you better.
  - title: No politics. No drama.
    body: >-
      Respect over rank. We built a studio where people simply train hard, help
      each other improve, and love the art.
  - title: Open Mat & Skill Labs
    body: >-
      Extra mat time to drill, flow, or roll at your own pace — relaxed,
      supportive, and focused on getting better.
  - title: Full gym access, 24/7
    body: >-
      Your membership includes The Mecca Gym — a 24,000 sq ft performance
      facility with weights, conditioning, showers and sauna.
